<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#15111c">
<title>던전 탐험</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="던전 탐험">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#d8d1e0; --panel:#c7bdd2; --ink:#231c2d; --muted:#5d516b;
  --hp:#d9483b; --hpBack:#3a2f45; --gold:#e8a93a;
  --btn:#3a3148; --btnEdge:#221b2c; --btnInk:#f3ecf8; --atk:#b8452f; --atkEdge:#6e2618;
  --frame:#120e18; --ring:rgba(35,28,45,.28);
  --homeBg:#221b2e; --homeInk:#f1e9f6; --homeMuted:#b3a6c2; --homeCard:#2c2439; --title:#f6d38e;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15111c; --panel:#1e1828; --ink:#efe8f5; --muted:#a396b2;
    --hpBack:#33293f; --btn:#3b3149; --btnEdge:#120e18; --frame:#07050a; --ring:rgba(239,232,245,.2);
    --homeBg:#120e18; --homeCard:#211a2c;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#15111c; --panel:#1e1828; --ink:#efe8f5; --muted:#a396b2;
  --hpBack:#33293f; --btn:#3b3149; --btnEdge:#120e18; --frame:#07050a; --ring:rgba(239,232,245,.2);
  --homeBg:#120e18; --homeCard:#211a2c;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Do Hyeon","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
button{-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
svg{display:block}
#app{height:100%;position:relative;display:flex;flex-direction:column;padding:0 env(safe-area-inset-right,0px) 0 env(safe-area-inset-left,0px)}

/* 전투 화면 */
#hud{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:10px 14px 8px;font-size:17px}
#hpWrap{flex:1 1 150px;min-width:140px;position:relative;height:22px;background:var(--hpBack);border:2px solid var(--frame);border-radius:3px;overflow:hidden}
#hpFill{position:absolute;inset:0 auto 0 0;width:100%;background:var(--hp);transition:width .15s}
#hpText{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:15px;text-shadow:0 1px 0 #000}
.stat{color:var(--muted);white-space:nowrap;display:flex;align-items:center;gap:4px}
.stat b{color:var(--ink);font-weight:normal}
.stat svg{width:16px;height:16px}
#pauseB,#musB{width:34px;height:30px;flex:none;border-radius:4px;border:2px solid var(--frame);background:var(--btn);color:var(--btnInk);font:inherit;font-size:15px;cursor:pointer}
#musB.off{opacity:.45;text-decoration:line-through}
.chip.mus{font:inherit;color:inherit;cursor:pointer;justify-content:center;font-size:15px}
.chip.mus.off{opacity:.55}
#faces{display:flex;gap:5px;flex:none}
.face{position:relative;width:38px;height:42px;border:2px solid var(--frame);border-radius:6px;background:var(--btn);padding:0;cursor:pointer;overflow:hidden;touch-action:none}
.face.on{outline:3px solid var(--gold);outline-offset:-1px}
.face.dead{opacity:.35}
.face canvas{width:25px;height:30px;image-rendering:pixelated;image-rendering:crisp-edges;display:block;margin:2px auto 0}
.face .lv{position:absolute;right:2px;top:0;font-size:10px;color:#fff;text-shadow:0 1px 0 #000}
.face i{position:absolute;left:2px;right:2px;bottom:2px;height:4px;background:#3a2f45;border-radius:2px;overflow:hidden}
.face i b{display:block;height:100%;background:#e0564a}
.face .cd{position:absolute;inset:0;background:rgba(0,0,0,.6);color:#fff;font-size:15px;display:none;align-items:center;justify-content:center}
#stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;position:relative}
#cv{image-rendering:pixelated;image-rendering:crisp-edges;border:3px solid var(--frame);border-radius:4px;display:block;background:#0a070e}
#controls{height:clamp(170px,30vh,230px);display:flex;background:var(--panel);border-top:3px solid var(--frame)}
#stickZone{flex:1;position:relative;touch-action:none}
#stickBase{position:absolute;left:50%;top:52%;width:104px;height:104px;margin:-52px 0 0 -52px;border-radius:50%;border:3px solid var(--ring);background:rgba(0,0,0,.08);opacity:.55;pointer-events:none}
#stickBase.on{opacity:1}
#stickKnob{position:absolute;left:50%;top:50%;width:46px;height:46px;border-radius:50%;background:var(--btn);border:3px solid var(--btnEdge);transform:translate(-50%,-50%)}
#btns{width:216px;position:relative}
.btn{position:absolute;border-radius:50%;border:3px solid var(--btnEdge);border-bottom-width:6px;color:var(--btnInk);display:flex;align-items:center;justify-content:center;font:inherit;touch-action:none;cursor:pointer}
.btn.down{transform:translateY(3px);border-bottom-width:3px}
#atk{width:92px;height:92px;right:20px;bottom:30px;background:var(--atk);border-color:var(--atkEdge);font-size:22px}
#roll{width:82px;height:82px;right:124px;bottom:18px;background:var(--btn);font-size:18px;overflow:hidden;--cd:0}
#roll::after{content:"";position:absolute;inset:0;border-radius:50%;pointer-events:none;background:conic-gradient(rgba(0,0,0,.62) calc(var(--cd) * 360deg),transparent 0)}
#roll span{position:relative;z-index:1}
#roll.cd span{font-size:24px}
#skill{width:62px;height:62px;right:32px;bottom:132px;background:#4a3a7a;border-color:#2a1f4a;font-size:13px;line-height:1.1;overflow:hidden;padding:3px;--cd:0}
#skill.hide{display:none}
#skill::after{content:"";position:absolute;inset:0;border-radius:50%;pointer-events:none;background:conic-gradient(rgba(0,0,0,.62) calc(var(--cd) * 360deg),transparent 0)}
#skill span{position:relative;z-index:1;word-break:keep-all;text-align:center}
#skill.cd span{font-size:20px}
.btncol{display:flex;flex-direction:column;gap:6px;flex:none}
#swap{display:none;width:58px;height:58px;right:150px;bottom:112px;background:var(--btn);font-size:16px}
#ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(10,7,14,.62);z-index:5}
#ov.hide{display:none}
.card{background:var(--panel);color:var(--ink);border:3px solid var(--frame);border-radius:6px;padding:22px 20px 18px;width:min(88%,330px);text-align:center}
.card h1{margin:0 0 8px;font-size:30px;font-weight:normal}
.card p{white-space:pre-line;margin:0 0 16px;font-size:16px;line-height:1.5;color:var(--muted);word-break:keep-all}
.card .row{display:flex;gap:10px;justify-content:center}
.card button{font:inherit;font-size:19px;padding:10px 20px;border-radius:5px;border:3px solid var(--atkEdge);border-bottom-width:5px;background:var(--atk);color:#fff;cursor:pointer}
.card button.sub{background:var(--btn);border-color:var(--btnEdge)}
.card button.hide{display:none}

/* 로비 */
#lobby{position:absolute;inset:0;z-index:10;display:grid;grid-template-rows:auto 1fr auto;padding:14px 14px 18px;color:var(--homeInk);
  background:radial-gradient(circle at 18% 38%,rgba(255,150,60,.2),transparent 42%),radial-gradient(circle at 82% 38%,rgba(255,150,60,.2),transparent 42%),var(--homeBg)}
#lobby.hide{display:none}
.ltop{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.brand h1{margin:0;font-weight:normal;font-size:32px;line-height:1;color:var(--title);text-shadow:3px 3px 0 var(--atkEdge)}
.brand p{margin:7px 0 0;color:var(--homeMuted);font-size:15px}
.brand p.sync{margin-top:4px;font-size:13px;opacity:.8}
.wallet{display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.chip{display:flex;align-items:center;justify-content:space-between;gap:8px;min-width:100px;background:var(--homeCard);border:2px solid var(--frame);border-radius:20px;padding:4px 12px 4px 6px;font-size:18px}
.chip svg{width:20px;height:20px}
.lmid{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:0;gap:6px}
#heroCv{image-rendering:pixelated;image-rendering:crisp-edges;height:min(42vh,320px);max-width:68%;aspect-ratio:48/40}
#heroName{color:var(--homeMuted);font-size:15px;text-align:center}
.side{position:absolute;right:0;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:12px}
.sq{position:relative;width:68px;height:68px;border-radius:10px;border:3px solid var(--frame);border-bottom-width:6px;background:var(--homeCard);color:var(--homeInk);font:inherit;font-size:15px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer}
.side.left{right:auto;left:0}
.item canvas{width:40px;height:48px;image-rendering:pixelated;image-rendering:crisp-edges;flex:none}
#heroCv{cursor:pointer}
.sq .ic{font-size:24px;line-height:1}
.sq:active,#startB:active{transform:translateY(3px);border-bottom-width:3px}
.dot{position:absolute;top:-6px;right:-6px;width:16px;height:16px;border-radius:50%;background:var(--hp);border:2px solid var(--frame)}
.dot.hide{display:none}
.lbot{display:flex;align-items:flex-end;gap:12px}
#startB{flex:1;max-width:250px;height:80px;border-radius:10px;border:3px solid var(--atkEdge);border-bottom-width:7px;background:var(--atk);color:#fff;font:inherit;font-size:30px;line-height:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;cursor:pointer}
#startB small{font-size:14px;opacity:.85}
#equipB{margin-left:auto;width:80px;height:80px}

/* 시트 */
#sheet{position:absolute;inset:0;z-index:20;background:rgba(10,7,14,.6);display:flex;align-items:flex-end;justify-content:center}
#sheet.hide{display:none}
.panel{width:100%;max-width:480px;max-height:84%;display:flex;flex-direction:column;background:var(--panel);color:var(--ink);border:3px solid var(--frame);border-bottom:none;border-radius:12px 12px 0 0;padding-bottom:env(safe-area-inset-bottom,0px)}
.ph{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 6px}
.ph h2{margin:0;font-weight:normal;font-size:25px}
#shX{width:38px;height:38px;border-radius:6px;border:2px solid var(--frame);background:var(--btn);color:var(--btnInk);font:inherit;font-size:18px;cursor:pointer}
.pb{overflow-y:auto;padding:2px 16px 20px;touch-action:pan-y;-webkit-overflow-scrolling:touch}
.pb h3{margin:16px 0 8px;font-weight:normal;font-size:17px;color:var(--muted)}
.maps{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mapc{font:inherit;color:inherit;text-align:left;background:var(--bg);border:3px solid var(--frame);border-radius:8px;padding:6px;cursor:pointer}
.mapc canvas{width:100%;aspect-ratio:88/51;image-rendering:pixelated;border-radius:4px;display:block}
.mapc .mn{font-size:16px;margin-top:5px}
.mapc .md{font-size:12px;color:var(--muted);line-height:1.35;word-break:keep-all;margin-top:2px}
.mapc.lock canvas{filter:grayscale(1) brightness(.45)}
.on{outline:3px solid var(--gold);outline-offset:-1px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opt{font:inherit;font-size:18px;color:inherit;background:var(--bg);border:3px solid var(--frame);border-radius:8px;padding:10px 6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px}
.opt small{font-size:12px;color:var(--muted)}
.opt:disabled{opacity:.45;cursor:not-allowed}
.opts.three{grid-template-columns:repeat(3,1fr)}
.opt canvas{width:30px;height:36px;image-rendering:pixelated;image-rendering:crisp-edges;margin-bottom:2px}
.opt.three small{text-align:center}
.go{width:100%;margin-top:20px;font:inherit;font-size:23px;padding:12px;border-radius:8px;border:3px solid var(--atkEdge);border-bottom-width:6px;background:var(--atk);color:#fff;cursor:pointer}
.list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;align-items:center;gap:10px;width:100%;background:var(--bg);border:3px solid var(--frame);border-radius:8px;padding:10px 12px;font:inherit;color:inherit;text-align:left}
button.item{cursor:pointer}
.item .tx{flex:1;min-width:0}
.pick{flex:1;min-width:0;display:flex;align-items:center;gap:10px;background:none;border:none;padding:0;font:inherit;color:inherit;text-align:left;cursor:pointer}
.item small.upl{display:block;margin-top:2px}
.item b .badge{font-size:12px;vertical-align:2px;margin-left:4px}
.item b{font-weight:normal;font-size:17px;display:block}
.item small{font-size:13px;color:var(--muted)}
.sw{width:12px;height:30px;border-radius:3px;border:2px solid var(--frame);flex:none}
.badge{font-size:13px;padding:3px 8px;border-radius:12px;background:var(--gold);color:#2a1a05;white-space:nowrap}
.buy{font:inherit;font-size:16px;padding:7px 11px;border-radius:6px;border:2px solid var(--frame);border-bottom-width:4px;background:var(--btn);color:var(--btnInk);cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:5px}
.buy svg{width:16px;height:16px}
.buy:disabled{opacity:.45;cursor:not-allowed}
.buy.claim{background:var(--atk);border-color:var(--atkEdge)}
.bar{height:8px;background:var(--hpBack);border-radius:4px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--gold)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:4px}
.stats div{background:var(--bg);border:2px solid var(--frame);border-radius:6px;padding:7px 10px;font-size:15px;display:flex;justify-content:space-between}
.stats b{font-weight:normal}
.stats.three{grid-template-columns:repeat(3,1fr)}
.stats.three div{flex-direction:column;gap:2px;font-size:14px}
.stats.three b{font-size:17px}
.wl{display:flex;gap:14px;font-size:18px;margin-top:4px}
.wl span{display:flex;align-items:center;gap:6px}
.wl svg{width:18px;height:18px}
.hint{color:var(--muted);font-size:14px;margin:12px 0 0;text-align:center}
.tabs{display:flex;overflow-x:auto;touch-action:pan-x;gap:6px;margin:12px 0 10px;position:sticky;top:0;z-index:1;background:var(--panel);padding:4px 0}
.tab{flex:1 0 auto;min-width:62px;font:inherit;font-size:18px;color:inherit;background:var(--bg);border:3px solid var(--frame);border-radius:8px;padding:9px 4px;cursor:pointer}
.tab.on{background:var(--btn);color:var(--btnInk);outline:none;border-bottom:3px solid var(--gold)}
#pmsg{position:absolute;z-index:3;pointer-events:none;font-size:14px;line-height:1.3;color:#fff;text-shadow:0 1px 0 #000,0 0 4px #000;max-width:190px;width:max-content;word-break:keep-all;opacity:0;transition:opacity .25s}
#pmsg.show{opacity:1}
#bossBar{position:absolute;top:8px;left:50%;transform:translateX(-50%);width:min(70%,420px);z-index:3;text-align:center;pointer-events:none}
#bossBar.hide{display:none}
#bossBar b{font-weight:normal;color:#f6d38e;text-shadow:0 1px 0 #000;font-size:15px}
#bossBar .bb{height:9px;background:#2a1f30;border:2px solid #07050a;border-radius:4px;overflow:hidden;margin-top:2px}
#bossBar i{display:block;height:100%;width:100%;background:linear-gradient(#ff7a5a,#c8402c)}
#dlg{position:absolute;inset:0;z-index:7;display:flex;align-items:flex-end;justify-content:center;padding:12px;background:linear-gradient(rgba(10,7,14,0) 35%,rgba(10,7,14,.6))}
#dlg.hide{display:none}
.dbox{display:flex;gap:10px;align-items:flex-start;width:min(96%,560px);background:var(--panel);color:var(--ink);border:3px solid var(--frame);border-radius:10px;padding:10px 12px;cursor:pointer}
#dlgFace{width:52px;height:52px;image-rendering:pixelated;image-rendering:crisp-edges;flex:none;background:var(--bg);border-radius:6px;border:2px solid var(--frame)}
#dlgFace.hide{display:none}
.dtx{flex:1;min-width:0}.dtx b{font-weight:normal;color:var(--atk);font-size:15px}
.dtx p{margin:2px 0 0;font-size:17px;line-height:1.4;word-break:keep-all}
.dmore{font-size:12px;color:var(--muted);text-align:right}
#dlgSkip{position:absolute;top:8px;right:8px;font:inherit;font-size:13px;background:var(--btn);color:var(--btnInk);border:2px solid var(--frame);border-radius:6px;padding:4px 10px;cursor:pointer}
.stars{color:var(--gold);letter-spacing:1px;font-size:14px}
.grade{display:inline-block;font-size:11px;padding:1px 7px;border-radius:9px;color:#fff;line-height:1.5}
.g-c{background:#7d8796}.g-r{background:#3f7ec0}.g-e{background:#8a4cc0}.g-l{background:#c98a1a}
.hcard .buy{margin-top:4px;padding:4px 10px;font-size:14px}
.sgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:8px}
.scard{display:flex;flex-direction:column;align-items:center;gap:2px;background:var(--bg);border:3px solid var(--frame);border-radius:8px;padding:6px 2px;text-align:center}
.scard canvas{width:30px;height:36px;image-rendering:pixelated}
.scard small{font-size:11px;color:var(--muted);line-height:1.2;word-break:keep-all}
.scard.new{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold) inset}
.scard b{font-weight:normal;font-size:13px}
.chap{background:var(--bg);border:3px solid var(--frame);border-radius:10px;padding:10px;margin-top:8px}
.chap h4{margin:0 0 6px;font-weight:normal;font-size:18px;display:flex;justify-content:space-between;align-items:center}
.chap h4 small{font-size:13px;color:var(--muted)}
.stgs{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.stg{font:inherit;color:inherit;background:var(--panel);border:2px solid var(--frame);border-bottom-width:4px;border-radius:8px;padding:6px 2px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px}
.stg b{font-weight:normal;font-size:16px}.stg small{font-size:11px;color:var(--muted);word-break:keep-all;text-align:center;line-height:1.2}
.stg .st{color:var(--gold);font-size:13px;letter-spacing:1px}
.stg.boss{border-color:var(--atkEdge)}
.stg:disabled{opacity:.4;cursor:not-allowed}
.chap.lock{opacity:.55}
#boon{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(10,7,14,.62);z-index:6}
#boon.hide{display:none}
.card .boonBtn{display:block;width:100%;margin-top:8px;text-align:left;font:inherit;font-size:16px;background:var(--bg);color:var(--ink);border:3px solid var(--frame);border-bottom-width:5px;border-radius:8px;padding:10px 12px;cursor:pointer}
.card .boonBtn:active{transform:translateY(2px);border-bottom-width:3px}
.card .boonBtn b{font-weight:normal;font-size:19px;display:block;color:var(--ink)}
.card .boonBtn small{color:var(--muted);font-size:14px}
#buffs{position:absolute;left:8px;top:6px;display:flex;flex-wrap:wrap;gap:4px;max-width:calc(100% - 16px);pointer-events:none;z-index:2}
#buffs span{font-size:12px;background:rgba(10,7,14,.72);color:#f6d38e;border-radius:10px;padding:2px 8px}
/* 가로 모드: 조이스틱 | 화면 | 버튼 */
@media (orientation:landscape){
  #app{display:grid;grid-template-columns:minmax(130px,19vw) minmax(0,1fr) minmax(190px,23vw);grid-template-rows:auto minmax(0,1fr)}
  .panel{max-height:94%;max-width:680px}
  #hud{grid-column:1/-1;grid-row:1}
  #stage{grid-column:2;grid-row:2}
  #controls{display:contents}
  #stickZone{grid-column:1;grid-row:2;background:var(--panel);border-right:3px solid var(--frame);border-top:3px solid var(--frame)}
  #btns{grid-column:3;grid-row:2;width:auto;background:var(--panel);border-left:3px solid var(--frame);border-top:3px solid var(--frame)}
  #stickBase{top:62%}
  .wallet{flex-direction:row;flex-wrap:wrap;justify-content:flex-end;max-width:64vw}
  .chip{min-width:0}
  #lobby{padding:10px 18px 12px}
}
@media (orientation:landscape) and (max-height:520px){
  .brand h1{font-size:26px}
  .brand p{margin-top:4px}
  .chip{font-size:15px;padding:3px 10px 3px 5px}
  .chip svg{width:16px;height:16px}

      P.rdx=dx/l;P.rdy=dy/l;P.rollT=.24;P.rollCd=Math.max(.8,ROLL_CD-P.b.roll);P.inv=Math.max(P.inv,.28);S.st.rolls++;sfx('roll');inc('roll');burst(P.x,P.y,5,'#6b5c80',30);}

    else{const sp=(P.swing>0?36:64)*(ST.spd+P.b.spd)*(P.haste>0?1.3:1)*(P.whirl>0?1.2:1)*(P.charge?.3:1)*(tileAt(Math.floor(P.x/T),Math.floor(P.y/T))===2?Math.min(1,.6+.08*Math.max(rlvOf(ST.acc),rlvOf(ST.acc2))):1);vx=mx*sp;vy=my*sp;
      if(Math.hypot(mx,my)>.2&&P.swing<=0){const l=Math.hypot(mx,my);P.fx=mx/l;P.fy=my/l;}}

function pullOne(kind){
  if(kind==='eq'){const order=['l','e','r','c'];let gi=order.indexOf(rollGrade()),pool=[];
    while(gi<order.length){pool=Object.keys(ACC_G).filter(k=>ACC_G[k]===order[gi]);if(pool.length)break;gi++;}
    const g=order[gi],aid=pool[Math.floor(Math.random()*pool.length)];
    if(!S.owned.includes(aid)){S.owned.push(aid);return{acc:aid,g,isNew:true};}
    S.afrag[aid]=(S.afrag[aid]||0)+1;return{acc:aid,g,afrag:1};}
  let r=Math.random(),g='c';
  if(r<GRADES.l.rate)g='l';else if(r<GRADES.l.rate+GRADES.e.rate)g='e';else if(r<GRADES.l.rate+GRADES.e.rate+GRADES.r.rate)g='r';
  const order=['l','e','r','c'];let gi=order.indexOf(g),pool=[];while(gi<order.length){pool=HERO_IDS.filter(id=>CLASSES[id].grade===order[gi]&&inPool(id));if(pool.length)break;gi++;}
  g=order[gi];const id=pool[Math.floor(Math.random()*pool.length)];
  if(!S.heroes[id]&&Math.random()<NEW_P){unlockHero(id);return{id,g,isNew:true};}
  const n=GRADES[g].frag;if(S.heroes[id])S.heroes[id].frag=(S.heroes[id].frag||0)+n;else{S.frags[id]=(S.frags[id]||0)+n;}

function openSheet(k){sheetKind=k;sheet.classList.remove('hide');renderSheet();shB.scrollTop=0;}

$('shX').addEventListener('click',closeSheet);
sheet.addEventListener('click',e=>{if(e.target===sheet)closeSheet();});
function b64e(str){const u=new TextEncoder().encode(str);let s2='';u.forEach(x=>s2+=String.fromCharCode(x));return btoa(s2);}
function b64d(b){const s2=atob(b),u=new Uint8Array(s2.length);for(let i=0;i<s2.length;i++)u[i]=s2.charCodeAt(i);return new TextDecoder().decode(u);}

function importCode(code){code=(code||'').replace(/\s+/g,'');if(!code.startsWith('DT2.'))throw new Error('bad');
  const o=JSON.parse(b64d(code.slice(4)));if(!o||typeof o!=='object'||!o.st)throw new Error('bad');S=norm(o);S.t=Date.now();save();}

  save();renderSheet();
}

function drawGacha(dt){const S2=gState;S2.t+=dt;const c=$('gcv'),g=c.getContext('2d'),W2=c.width,H2=c.height,cx=W2/2,cy=H2/2,col=GCOL[S2.best],t=S2.t,R=Math.min(W2,H2)*.3;
  g.fillStyle='rgba(7,5,12,.3)';g.fillRect(0,0,W2,H2);
  if(S2.phase==='charge'){const k=Math.min(1,t/1.5);
    for(let i=0;i<4;i++){const p=Math.random()*6.28,r0=R*(1.6+Math.random()*.6);S2.parts.push({a:p,r:r0,s:.6+Math.random()*.8});}
    g.save();g.translate(cx,cy);g.globalCompositeOperation='lighter';
    for(let ring=0;ring<3;ring++){const rr=R*(.55+ring*.25),rot=t*(ring%2?-1:1)*(.8+ring*.4);g.strokeStyle=`rgba(${col},${.25+.5*k})`;g.lineWidth=2;g.beginPath();g.arc(0,0,rr,0,6.29);g.stroke();
      for(let j=0;j<10+ring*4;j++){const a=rot+j*6.283/(10+ring*4);g.fillStyle=`rgba(${col},${.5+.5*k})`;g.fillRect(Math.cos(a)*rr-2,Math.sin(a)*rr-2,4,4);}}
    g.strokeStyle=`rgba(${col},${.4*k})`;g.beginPath();for(let j=0;j<6;j++){const a=t*.6+j*2.094;g.lineTo(Math.cos(a)*R*.8,Math.sin(a)*R*.8);}g.closePath();g.stroke();

    S2.parts=S2.parts.filter(p=>p.r>4);
    const gr=g.createRadialGradient(0,0,1,0,0,R*.5*(.3+k));gr.addColorStop(0,`rgba(255,255,255,${.9*k})`);gr.addColorStop(.3,`rgba(${col},${.7*k})`);gr.addColorStop(1,`rgba(${col},0)`);g.fillStyle=gr;g.fillRect(-R,-R,R*2,R*2);
    g.restore();if(t>=1.5){S2.phase='flash';S2.t=0;sfx('boom');}}
  else if(S2.phase==='flash'){g.fillStyle=`rgba(255,255,255,${Math.max(0,1-t/.4)})`;g.fillRect(0,0,W2,H2);if(t>=.4){if(S2.specials.length)gShowReveal();else gShowCards();}}
  else{const x=S2.phase==='reveal'?S2.specials[S2.sp]:null,c2=x?GCOL[x.g]:col;g.save();g.translate(cx,cy);g.globalCompositeOperation='lighter';
    const n=x?16:8;for(let i=0;i<n;i++){const a=t*(x?.5:.2)+i*6.283/n;g.fillStyle=`rgba(${c2},${x?.12:.05})`;g.beginPath();g.moveTo(0,0);g.lineTo(Math.cos(a-.08)*W2,Math.sin(a-.08)*W2);g.lineTo(Math.cos(a+.08)*W2,Math.sin(a+.08)*W2);g.fill();}
    if(x&&Math.random()<.6){S2.parts.push({a:Math.random()*6.28,r:10,s:1,out:1});}
    for(const p of S2.parts){if(p.out){p.r+=dt*160;g.fillStyle=`rgba(${c2},.8)`;g.fillRect(Math.cos(p.a)*p.r,Math.sin(p.a)*p.r,2,2);}}S2.parts=S2.parts.filter(p=>!p.out||p.r<Math.max(W2,H2));
    g.restore();}}

function ensureAudio(){

function tone(type,f,t,dur,vol){const o=actx.createOscillator(),g=actx.createGain();o.type=type;o.frequency.value=f;
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.008);g.gain.exponentialRampToValueAtTime(Math.max(vol*.5,.0001),t+dur*.7);g.gain.linearRampToValueAtTime(0,t+dur);
  o.connect(g);g.connect(mGain);o.start(t);o.stop(t+dur+.02);}
function kick(t,v){const o=actx.createOscillator(),g=actx.createGain();o.frequency.setValueAtTime(130,t);o.frequency.exponentialRampToValueAtTime(40,t+.12);
  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+.15);o.connect(g);g.connect(mGain);o.start(t);o.stop(t+.16);}
function noise(t,dur,v,freq,type){const n=actx.createBufferSource(),f=actx.createBiquadFilter(),g=actx.createGain();n.buffer=noiseBuf;f.type=type;f.frequency.value=freq;
  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);n.connect(f);f.connect(g);g.connect(mGain);n.start(t);n.stop(t+dur+.02);}
function noteLen(a,i){let k=1;while(k<4&&a[(i+k)%a.length]==null)k++;return k;}
function schedule(){
  if(!actx||!curSong||actx.state!=='running')return;
  const so=SONGS[curSong],sd=60/so.bpm/4;
  if(mNext<actx.currentTime)mNext=actx.currentTime+.05;
  while(mNext<actx.currentTime+.12){const i=mStep%64,t=mNext;
    for(const v of so.voices){const n=v.notes[i];if(n!=null)tone(v.type,mf(n),t,noteLen(v.notes,i)*sd*v.hold,v.vol);}
    if(so.kick&&so.kick.includes(i%16))kick(t,.45);
    if(so.snare&&so.snare.includes(i%16))noise(t,.12,.16,1500,'bandpass');
    if(so.hat&&i%so.hat===0)noise(t,.03,so.hatV,7000,'highpass');
    mNext+=sd;mStep++;}
}

addEventListener('click',e=>{const b=e.target.closest&&e.target.closest('button');

$('musB').addEventListener('click',()=>setMusic(!musicOn));

document.addEventListener('visibilitychange',()=>{if(!actx)return;if(document.hidden)actx.suspend();else if(musicOn||sfxOn)actx.resume();});
renderMusic();

/* ---------- 시작 ---------- */
showLobby();fit();renderSync();initCloud();
let last=performance.now();
document.addEventListener('visibilitychange',()=>{last=performance.now();if(document.hidden){pause();save();clearTimeout(cloudT);pushCloud();}});
function frame(now){let dt=Math.min(.05,(now-last)/1000);last=now;
  if(hitStop>0){hitStop-=dt;dt=0;}
  if(state!=='paused')update(dt);render();hud();
  if(gState)drawGacha(Math.min(.05,(now-(gState.last||now))/1000)),gState&&(gState.last=now);
  if(!lobby.classList.contains('hide'))drawHero();
  {const c=document.getElementById('hBig');if(c&&heroSel&&S.heroes[heroSel]){const g=c.getContext('2d'),t=performance.now()/1000,s2=stats(heroSel),b=Math.round(Math.abs(Math.sin(t*3)));
    g.imageSmoothingEnabled=false;g.clearRect(0,0,24,26);if(s2.awake)drawLight(g,12,14,14,'246,211,142',.35+.15*Math.sin(t*4));
    g.fillStyle='rgba(0,0,0,.35)';g.beginPath();g.ellipse(12,22,6,2,0,0,7);g.fill();g.drawImage(pSpr(heroSel,s2.armor).n,7,10-b);drawHeld(g,12,21-b,s2,false);}}
  musicTick();
  requestAnimationFrame(frame);}
requestAnimationFrame(frame);
})();
</script>
<script>
if('serviceWorker' in navigator){addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{});});}
</script>
